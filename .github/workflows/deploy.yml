name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore proprietary icons
        run: echo "${{ secrets.ICONS_JSON_B64 }}" | base64 -d > src/lib/assets/icons.json

      - name: Validate icons
        run: |
          node -e "
            const icons = require('./src/lib/assets/icons.json');
            const required = [
              'arrow-down', 'curly-brackets', 'delete-left', 'objects-column',
              'sun-bright', 'eye', 'language', 'paragraph'
            ];
            const missing = required.filter(k => !icons[k]?.viewBox);
            if (missing.length) {
              console.error('Missing icons in ICONS_JSON_B64 secret:', missing.join(', '));
              process.exit(1);
            }
            console.log('All', required.length, 'icons present with viewBox.');
          "

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
